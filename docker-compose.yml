services:
    db:
        image: postgres:18
        container_name: ate-a-falha-db
        env_file:
            - .env
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d ate_a_falha_db']
            interval: 5s
            timeout: 5s
            retries: 5

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        container_name: ate-a-falha-api
        env_file:
            - .env
        ports:
            - '${API_PORT:-3333}:${API_PORT:-3333}'
        depends_on:
            db:
                condition: service_healthy

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        container_name: ate-a-falha-web
        env_file:
            - .env
        ports:
            - '${WEB_PORT:-3000}:${WEB_PORT:-3000}'

        depends_on:
            - api

volumes:
    pgdata:
