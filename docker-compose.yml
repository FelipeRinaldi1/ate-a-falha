services:
    db:
        image: postgres:18
        container_name: ate-a-falha-db
        env_file:
            - apps/api/.env
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d ate_a_falha_db']
            interval: 5s
            timeout: 5s
            retries: 5

    pipeline:
        profiles:
            - tools
        build:
            context: ./pipeline
            dockerfile: Dockerfile
        container_name: ate-a-falha-pipeline
        volumes:
            - ./data:/app/data
            - ./packages/database:/packages/database
        depends_on:
            db:
                condition: service_healthy

volumes:
    pgdata:
