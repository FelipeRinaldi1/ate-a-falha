services:
    db:
        image: postgres:18
        container_name: ate-a-falha-db
        env_file:
            - .env
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql

    api:
        image: node:24
        container_name: ate-a-falha-api
        working_dir: /app
        env_file:
            - .env
        volumes:
            - .:/app
            - /app/node_modules
        ports:
            - '3333:3333'
        depends_on:
            - db
        stdin_open: true
        tty: true
        command: /bin/sh -c "chown -R node:node /app/node_modules && sleep infinity"

    web:
        image: node:24
        container_name: ate-a-falha-web
        working_dir: /app
        env_file:
            - .env
        volumes:
            - .:/app
            - /app/node_modules
        ports:
            - '3000:3000'
        stdin_open: true
        tty: true
        command: sleep infinity

volumes:
    pgdata:
    api_node_modules:
    web_node_modules:
